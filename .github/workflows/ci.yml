name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET) build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore backend/SimpleWebApp.sln
      - name: Build (Release)
        run: dotnet build backend/SimpleWebApp.sln --configuration Release --no-restore
      - name: Test (Release)
        run: dotnet test backend/SimpleWebApp.sln --configuration Release --no-build

  frontend:
    name: Frontend (Angular) build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: frontend
        run: npm install
      - name: Build (production)
        working-directory: frontend
        run: npm run build -- --configuration=production
      - name: Test (headless)
        working-directory: frontend
        run: npm test -- --watch=false --browsers=ChromeHeadless
        continue-on-error: true

name: Deploy

# --- Trigger: manual, with an environment picker (given) ---
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        default: development
        options:
          - development
          - staging
          - production
      version:
        description: 'Version label for the package (e.g. 1.0.42)'
        required: false
        default: 'manual'

permissions:
  contents: read

jobs:
  package:
    name: Build ${{ github.event.inputs.environment }} package
    runs-on: ubuntu-latest
    # Binds the run to a GitHub Environment of the same name. Create these
    # environments in repo Settings so you can attach reviewers + secrets.
    environment: ${{ github.event.inputs.environment }}

name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        default: development
        options: [development, staging, production]
      version:
        description: "Release tag to deploy (e.g. v1.0.0) or 'latest'"
        required: true
        default: "latest"

permissions:
  contents: read

# ---- All non-secret config lives here (edit in ONE place) ----
env:
  WEB_SITE: SimpleWebApp-Web
  WEB_POOL: SimpleWebApp-Web
  WEB_PATH: C:\inetpub\web
  API_SITE: SimpleWebApp-Api
  API_POOL: SimpleWebApp-Api
  API_PATH: C:\inetpub\api
  WEB_HEALTH: http://localhost/
  API_HEALTH: http://localhost:8080/health
  INCOMING: C:\deploy-incoming
  BACKUPS: C:\deploy-backups
  KEEP_BACKUPS: "5"
  HEALTH_RETRIES: "10"
  HEALTH_DELAY: "6"


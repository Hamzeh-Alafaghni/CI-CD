name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [development, staging, production]
        default: development
        required: true
      version:
        description: "Release tag (e.g. v1.0.0) or 'latest'"
        default: "latest"
        required: true

permissions:
  contents: read

env:
  WEB_SITE: SimpleWebApp-Web
  WEB_POOL: SimpleWebApp-Web
  WEB_PATH: C:\inetpub\web
  API_SITE: SimpleWebApp-Api
  API_POOL: SimpleWebApp-Api
  API_PATH: C:\inetpub\api
  WEB_HEALTH: http://localhost/
  API_HEALTH: http://localhost:8080/health
  INCOMING: C:\deploy-incoming
  BACKUPS: C:\deploy-backups
  KEEP_BACKUPS: "5"
  HEALTH_RETRIES: "10"
  HEALTH_DELAY: "6"

jobs:
  deploy:
    runs-on: windows-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.inputs.version }}"
          if ($tag -eq "latest") {
            gh release download --pattern "*.zip"
          } else {
            gh release download $tag --pattern "*.zip"
          }

      - name: Validate package
        run: |
          if (-not (Test-Path "api.zip")) { throw "api.zip not found!" }
          if (-not (Test-Path "web.zip")) { throw "web.zip not found!" }
          
          if ((Get-Item "api.zip").length -eq 0) { throw "api.zip is empty!" }
          if ((Get-Item "web.zip").length -eq 0) { throw "web.zip is empty!" }
          
          $apiValid = tar -tf api.zip | Select-String "web.config" -Quiet
          if (-not $apiValid) { throw "web.config not found in api.zip!" }
          
          $webValid = tar -tf web.zip | Select-String "index.html" -Quiet
          if (-not $webValid) { throw "index.html not found in web.zip!" }
          Write-Host "Package validation passed."

      - name: Configure SSH and Test Connection
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts
          
          USER_TEST=$(ssh -i ~/.ssh/id_ed25519 $SSH_USER@$SSH_HOST "whoami")
          if [ -z "$USER_TEST" ]; then
            echo "SSH Connection Failed"
            exit 1
          fi
          echo "SSH connection successful as: $USER_TEST"

      - name: Generate deployment script
        run: |
          $script = @"
          `$ErrorActionPreference = 'Stop'
          `$timestamp = (Get-Date).ToString('yyyyMMdd-HHmmss')
          `$apiBackup = "$env:BACKUPS\api-`$timestamp"
          `$webBackup = "$env:BACKUPS\web-`$timestamp"

          Write-Host "1. Backing up current sites..."
          if (-not (Test-Path "$env:BACKUPS")) { New-Item -ItemType Directory -Force -Path "$env:BACKUPS" | Out-Null }
          if (Test-Path "$env:API_PATH") { Copy-Item -Path "$env:API_PATH" -Destination `$apiBackup -Recurse -Force }
          if (Test-Path "$env:WEB_PATH") { Copy-Item -Path "$env:WEB_PATH" -Destination `$webBackup -Recurse -Force }

          Write-Host "2. Pruning old backups (Keeping $env:KEEP_BACKUPS)..."
          Get-ChildItem -Path "$env:BACKUPS\api-*" -Directory | Sort-Object CreationTime -Descending | Select-Object -Skip $env:KEEP_BACKUPS | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path "$env:BACKUPS\web-*" -Directory | Sort-Object CreationTime -Descending | Select-Object -Skip $env:KEEP_BACKUPS | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          try {
              Write-Host "3. Swapping files..."
              if (-not (Test-Path "$env:API_PATH")) { New-Item -ItemType Directory -Force -Path "$env:API_PATH" | Out-Null }
              Set-Content -Path "$env:API_PATH\app_offline.htm" -Value "Deploying..." -Force
              Start-Sleep -Seconds 2
              
              Remove-Item -Path "$env:API_PATH\*" -Exclude "app_offline.htm" -Recurse -Force -ErrorAction SilentlyContinue
              Expand-Archive -Path "$env:INCOMING\api.zip" -DestinationPath "$env:API_PATH" -Force
              
              if (-not (Test-Path "$env:WEB_PATH")) { New-Item -ItemType Directory -Force -Path "$env:WEB_PATH" | Out-Null }
              Remove-Item -Path "$env:WEB_PATH\*" -Recurse -Force -ErrorAction SilentlyContinue
              Expand-Archive -Path "$env:INCOMING\web.zip" -DestinationPath "$env:WEB_PATH" -Force
              
              Remove-Item -Path "$env:API_PATH\app_offline.htm" -Force -ErrorAction SilentlyContinue
              
              Write-Host "4. Recycling App Pools..."
              Import-Module WebAdministration
              Restart-WebAppPool -Name "$env:API_POOL"
              Restart-WebAppPool -Name "$env:WEB_POOL"
              
              Write-Host "5. Health Check..."
              `$isHealthy = `$false
              for (`$i = 1; `$i -le $env:HEALTH_RETRIES; `$i++) {
                  try {
                      `$apiHealth = Invoke-WebRequest -Uri "$env:API_HEALTH" -UseBasicParsing -TimeoutSec 5
                      `$webHealth = Invoke-WebRequest -Uri "$env:WEB_HEALTH" -UseBasicParsing -TimeoutSec 5
                      
                      if (`$apiHealth.StatusCode -eq 200 -and `$webHealth.StatusCode -eq 200) {
                          `$isHealthy = `$true
                          break
                      }
                  } catch {
                      Write-Host "Health check attempt `$i failed: `$(`$_.Exception.Message)"
                  }
                  Write-Host "Waiting $env:HEALTH_DELAY seconds before next retry..."
                  Start-Sleep -Seconds $env:HEALTH_DELAY
              }
              
              if (-not `$isHealthy) {
                  throw "Health checks failed after $env:HEALTH_RETRIES retries."
              }
              Write-Host "SUCCESS: deploy healthy"
          } catch {
              Write-Host "ERROR: Deploy failed. Initiating ROLLBACK..."
              Write-Host "Error details: `$(`$_.Exception.Message)"
              if (Test-Path `$apiBackup) {
                  Remove-Item -Path "$env:API_PATH\*" -Recurse -Force -ErrorAction SilentlyContinue
                  Copy-Item -Path "`$apiBackup\*" -Destination "$env:API_PATH" -Recurse -Force
              }
              if (Test-Path `$webBackup) {
                  Remove-Item -Path "$env:WEB_PATH\*" -Recurse -Force -ErrorAction SilentlyContinue
                  Copy-Item -Path "`$webBackup\*" -Destination "$env:WEB_PATH" -Recurse -Force
              }
              Import-Module WebAdministration
              Restart-WebAppPool -Name "$env:API_POOL"
              Restart-WebAppPool -Name "$env:WEB_POOL"
              Write-Host "Rollback completed."
              exit 1
          }
          "@
          $script | Out-File -FilePath run-deploy.ps1 -Encoding utf8

      - name: Copy files and deploy script to server
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          scp -i ~/.ssh/id_ed25519 api.zip web.zip run-deploy.ps1 $SSH_USER@$SSH_HOST:'C:\deploy-incoming\'

      - name: Execute deployment on server
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 $SSH_USER@$SSH_HOST "powershell.exe -ExecutionPolicy Bypass -File C:\deploy-incoming\run-deploy.ps1"

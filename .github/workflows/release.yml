# ============================================================
# RELEASE — triggered by pushing a version TAG (e.g. v1.2.0).
# Tests, builds, packages api.zip + web.zip, and publishes a
# GitHub Release with those assets. The Deploy workflow later
# pulls these exact assets. (Build once, deploy that artifact.)
# ============================================================
name: Release

on:
  push:
    tags: ["v*.*.*"]           # e.g. git tag v1.0.0 && git push origin v1.0.0
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write              # needed to create the Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version from tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG"              >> $GITHUB_OUTPUT
          echo "version=${TAG#v}"      >> $GITHUB_OUTPUT   # strip leading 'v'
          echo "Releasing $TAG"

  backend:
    name: Package backend -> api.zip
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test before release
        run: dotnet test backend/SimpleWebApp.sln --configuration Release
      - name: Publish (stamp version)
        run: >
          dotnet publish backend/SimpleWebApp.Api/SimpleWebApp.Api.csproj
          --configuration Release --runtime win-x64 --self-contained false
          -p:Version=${{ needs.version.outputs.version }}
          --output publish/api
      - name: Zip as api.zip (contents at root)
        run: cd publish/api && zip -r "$GITHUB_WORKSPACE/api.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: backend
          path: api.zip

  frontend:
    name: Package frontend -> web.zip
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: frontend
        run: npm install
      - name: Build (production)
        working-directory: frontend
        run: npm run build -- --configuration=production
      - name: Zip as web.zip (contents at root)
        run: cd frontend/dist/frontend/browser && zip -r "$GITHUB_WORKSPACE/web.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: web.zip

  release:
    name: Publish GitHub Release
    needs: [version, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Release ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/backend/api.zip
            artifacts/frontend/web.zip
